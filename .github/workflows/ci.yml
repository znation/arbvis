name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when a branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain action needed: rustup is preinstalled on the runner and
      # auto-installs the version + components pinned in rust-toolchain.toml.
      # `rustup show` forces that install before the cache key is computed.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo doc (deny warnings)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup auto-installs the version pinned in rust-toolchain.toml; see fmt-clippy.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --all-features

  # The deployed Space app (src/space_template/app.py.tmpl) is Python, outside
  # the cargo suite. Its HTTP Range tests (src/space_template/test_app.py) skip
  # themselves when their deps are missing, so without this job they never run
  # anywhere and can rot silently. fastapi + huggingface_hub come from
  # src/space_template/requirements.txt; httpx is the additional test-only dep
  # of starlette's TestClient.
  space-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi httpx huggingface_hub
      - run: python3 src/space_template/test_app.py
