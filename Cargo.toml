[workspace]
resolver = "2"
members = ["crates/arbvis", "crates/modelweightvis"]

# `Cargo.lock` and `target/` stay at the workspace root so all members share
# resolved deps and incremental build artifacts. The pre-commit hook keys off
# the workspace root, so `cargo fmt --all` and `cargo clippy --all-targets`
# cover every member from one invocation.
