[package]
name = "arbvis"
version = "0.1.0"
edition = "2021"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fast_hilbert = "2.0"
image = "0.25"
imageproc = "0.25"
indicatif = "0.17"
# Routes log::* output through indicatif's MultiProgress so log lines and
# progress bars never overwrite each other.
indicatif-log-bridge = "0.2"
memmap2 = "0.9"
minifb = "0.27"
rayon = "1"
log = "0.4"
env_logger = "0.11"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2"
hf-hub = "1.0.0-rc.1"
# xet-core-structures is the chunk/xorb wire format used by hf-hub internally.
# We pull it in directly so we can decode xorb byte segments after fetching
# them from CAS URLs ourselves — bypassing hf-hub's per-call xet stream group
# rebuild, which dominates wall time for per-tile range requests.
xet-core-structures = "1.5"
# Byte-bounded LRU cache for decompressed xorb chunk segments, hit per tile.
lru = "0.12"
bytes = "1"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-channel = "2"
async-trait = "0.1"